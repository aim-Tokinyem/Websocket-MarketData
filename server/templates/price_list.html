<!DOCTYPE html>
<html>
<head>
    <title>Price List</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3, h4 {
            text-align: center;
            margin-top: 30px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="text"],
        select,
        button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
        }
        input[type="text"]:focus,
        select:focus {
            outline: none;
        }

        .container {
            text-align: right;
            padding: 10px;
            margin-right: 10px;
        }
        #filter-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        #filter-container label {
            margin: 0 10px;
        }
        #filter-container input {
            padding: 10px;
            margin: 0 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }
        #filter-container input:focus {
            outline: none;
            border-color: #888;
        }
        .styled-table-container {
            width: 98%;
            height: 550px; /* Set your desired height */
            overflow: auto;
            margin-left: 15px;
            margin-right: 15px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .styled-table {
            width: 98%;
            border-collapse: collapse;
            border-spacing: 0;
            border-radius: 15px;
            overflow: hidden;
            margin-left: 15px;
            margin-right: 15px;
            margin-bottom: 15px;
            font-size: 0.9em;
            font-family: sans-serif;
            min-width: 400px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .styled-table thead {
            background-color: #313131;
            color: #ffffff;
            text-align: left;
            position: sticky; /* Keeps the header fixed when scrolling */
            top: 0;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.507); 
        }

        .styled-table th,
        .styled-table td {
            padding: 12px 15px;
        }

        .styled-table tbody {
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(93vh - 200px);
        }

        .styled-table thead,
        .styled-table tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .styled-table tbody tr {
            border-bottom: 1px solid #2e2e2e;
        }

        .styled-table tbody tr:nth-of-type(even) {
            background-color: #2e2e2e;
        }

        .updated-row {
            background-color: #e68a00 !important; /* Use !important to ensure the color is applied */
        }

        /* Styling the scrollbar for WebKit browsers (e.g., Chrome, Safari) */
        .styled-table tbody::-webkit-scrollbar, select::-webkit-scrollbar {
            background-color: #202020;
            width: 5px; /* Width of the scrollbar */
        }

        .styled-table tbody::-webkit-scrollbar-thumb, select::-webkit-scrollbar-thumb {
            background-color: #df9100; /* Color of the scrollbar thumb */
            border-radius: 6px; /* Roundness of the scrollbar thumb */
        }

        .styled-table tbody::-webkit-scrollbar-track, select::-webkit-scrollbar-track {
            background-color: #333; /* Color of the scrollbar track */
            border-radius: 6px; /* Roundness of the scrollbar track */
        }

        select::-webkit-scrollbar-thumb:hover {
            background-color: #e68a00; /* Darker shade on hover */
        }
        /* Main container to account for navbar width */
        .main-container {
            margin-left: 250px; /* Width of navbar (200px) + some space */
            padding: 20px;
            flex-grow: 1; /* Ensures the content takes up the remaining space */
        }
        .container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
            margin-right: 10px;
            gap: 10px; /* Space between input fields and buttons */
        }
    </style>
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    
    <div id="navbar"></div>
    
    <!-- <div class="container"> -->
        
        <div class="main-container">
            <!-- <div id="footer"></div> -->
        <h1>Live Exchange Rates</h1>
        <div class="container">
            <input type="text" id="currency1-filter" placeholder="Enter currency 1">
            <input type="text" id="currency2-filter" placeholder="Enter currency 2">
        </div>

        <table class="styled-table">
            <thead>
                <tr>
                    <th id="currency1-header">Currency 1</th>
                    <th id="currency2-header">Currency 2</th>
                    <th id="BID">BID</th>
                    <th id="ASK">ASK</th>
                    <th id="Date">Date</th>
                </tr>
            </thead>

            <tbody id="data-table">
                <!-- Data will be dynamically updated here -->
            </tbody>
        </table>
        
    </div>
    
    <script>
                // Fetch the navbar.html content using Fetch API
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                // Insert the navbar HTML into the div with id="navbar"
                document.getElementById('navbar').innerHTML = data;
            })
            .catch(error => console.error('Error fetching navbar:', error));

        
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Error fetching footer :', error));

        function fetchData() {
            $.ajax({
                url: '/price_data',
                type: 'GET',
                success: function(response) {
                    console.log('Received data:', response.data); 
                    updateUI(response.data);
                },
                error: function(error) {
                    console.error('Error fetching data:', error);
                }
            });
        }

        $(document).ready(function() {
            fetchData();

            // Add event listeners to filter inputs to update the UI when filter values change
            $('#currency1-filter').on('input', fetchData);
            $('#currency2-filter').on('input', fetchData);
        });

        let previousData = [];
        let isFirstLoad = true; // Flag to track if it's the first load

        function updateUI(newData) {
            const filterCurrency1 = $('#currency1-filter').val().toLowerCase();
            const filterCurrency2 = $('#currency2-filter').val().toLowerCase();

            // Create a map of the new data for easier comparison
            const newDataMap = new Map();
            newData.forEach(item => {
                const key = `${item[0]}-${item[1]}`; // Unique key based on currency1 and currency2
                newDataMap.set(key, item);
            });

            $('#data-table').empty(); // Clear existing rows

            // Add or update rows
            newData.forEach(function(item) {
                const currency1 = item[0].toLowerCase();
                const currency2 = item[1].toLowerCase();

                if ((filterCurrency1 === '' || currency1.includes(filterCurrency1)) &&
                    (filterCurrency2 === '' || currency2.includes(filterCurrency2))) {

                    const date = new Date(item[3]); // Assuming the date is at index 3
                    const localDate = date.toLocaleString();
                    const key = `${item[0]}-${item[1]}`;

                    $('#data-table').append(`
                        <tr data-key="${key}">
                            <td>${item[0]}</td> <!-- Currency 1 -->
                            <td>${item[1]}</td> <!-- Currency 2 -->
                            <td>${item[5]}</td> <!-- BID -->
                            <td>${item[7]}</td> <!-- ASK -->
                            <td>${localDate}</td> <!-- Date -->
                        </tr>
                    `);
                }
            });

            // Apply the highlight only if it's not the first load
            if (!isFirstLoad) {
                // Highlight rows that have changed
                $('#data-table tr').each(function() {
                    const $row = $(this);
                    const key = $row.data('key');
                    const isUpdated = !previousData.some(prevItem => {
                        const prevKey = `${prevItem[0]}-${prevItem[1]}`;
                        return prevKey === key && JSON.stringify(prevItem) === JSON.stringify(newDataMap.get(key));
                    });
                    if (isUpdated) {
                        $row.addClass('updated-row');
                    }
                });

                // Remove the highlight after 1 second
                setTimeout(() => {
                    $('.updated-row').removeClass('updated-row');
                }, 1000);
            }

            // Store new data for next comparison
            previousData = newData;

            // Set the flag to false after the first update
            if (isFirstLoad) {
                isFirstLoad = false;
            }
        }

        // Fetch data every 3 seconds
        setInterval(fetchData, 3000);


    </script>
</body>
</html>
