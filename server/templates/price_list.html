<!DOCTYPE html>
<html>
<head>
    <title>Real-time Data Display - Dark Mode</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .currency-box {
            border: 1px solid #555;
            padding: 20px;
            margin: 10px;
            width: 250px;
            height: 180px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            background-color: #2d2d2d;
            transition: transform 0.3s ease-in-out;
        }
        .currency-box:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .currency-details {
            font-size: 16px;
            margin-top: 10px;
        }
        h1, h2, h3, h4 {
            text-align: center;
            margin-top: 30px;
        }
        #data-container {
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #filter-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        #filter-container label {
            margin: 0 10px;
        }
        #filter-container input {
            padding: 10px;
            margin: 0 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }
        #filter-container input:focus {
            outline: none;
            border-color: #888;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <h1>Real-time Data from PostgreSQL Database</h1>
        <h3>Filter</h3>
        <div id="filter-container">
            <label for="currency1-filter">Currency 1:</label>
            <input type="text" id="currency1-filter" placeholder="Enter currency 1">
            <label for="currency2-filter">Currency 2:</label>
            <input type="text" id="currency2-filter" placeholder="Enter currency 2">
        </div>
        
        <div id="data-container">
            <!-- Data will be dynamically updated here -->
        </div>
    </div>

    <script>
        // Fetch the navbar.html content using Fetch API
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                // Insert the navbar HTML into the div with id="navbar"
                document.getElementById('navbar').innerHTML = data;
            })
            .catch(error => console.error('Error fetching navbar:', error));

        function fetchData() {
            $.ajax({
                url: '/price_data',
                type: 'GET',
                success: function(response) {
                    console.log('Received data:', response.data); 
                    updateUI(response.data);
                },
                error: function(error) {
                    console.error('Error fetching data:', error);
                }
            });
        }

        function updateUI(data) {
            const dataContainer = document.getElementById('data-container');
            dataContainer.innerHTML = ''; // Clear existing data

            const filterInput1 = document.getElementById('currency1-filter');
            const filterValue1 = filterInput1.value.toUpperCase(); // Get filter value and convert to uppercase

            const filterInput2 = document.getElementById('currency2-filter');
            const filterValue2 = filterInput2.value.toUpperCase(); // Get filter value and convert to uppercase

            data.forEach(function(item) {
                const cur1Match = filterValue1 === '' || item[0].toUpperCase() === filterValue1;
                const cur2Match = filterValue2 === '' || item[1].toUpperCase() === filterValue2;

                if (cur1Match && cur2Match) {
                    const date = new Date(item[3]);
                    const localDate = date.toLocaleString();

                    const currencyBox = document.createElement('div');
                    currencyBox.classList.add('currency-box');
                    currencyBox.innerHTML = `
                        <h3>${item[0]}/${item[1]}</h3>
                        <div class="currency-details">
                            <p>BID: ${item[5]}</p>
                            <p>ASK: ${item[7]}</p>
                            <p>Date: ${localDate}</p>
                        </div>
                    `;
                    dataContainer.appendChild(currencyBox);
                }
            });
        }

        // Fetch data initially and set up event listeners for filter inputs
        $(document).ready(function() {
            fetchData();

            // Add event listeners to filter inputs to update the UI when filter values change
            $('#currency1-filter').on('input', fetchData);
            $('#currency2-filter').on('input', fetchData);
        });

        // Fetch data every 1 seconds (adjust as needed)
        setInterval(fetchData, 1000); // Polling interval: 1000 milliseconds (1 seconds)

        // Initial fetch when the page loads
        $(document).ready(function() {
            fetchData();
        });
    </script>
</body>
</html>
