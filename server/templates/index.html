<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Exchange Rates</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3, h4 {
            text-align: center;
            margin-top: 30px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="text"],
        select,
        button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
        }
        input[type="text"]:focus,
        select:focus {
            outline: none;
        }

        .container {
            text-align: right;
            padding: 10px;
            margin-right: 10px;
        }
        #filter-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        #filter-container label {
            margin: 0 10px;
        }
        #filter-container input {
            padding: 10px;
            margin: 0 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }
        #filter-container input:focus {
            outline: none;
            border-color: #888;
        }
        .styled-table-container {
            width: 98%;
            height: 550px; /* Set your desired height */
            overflow: auto;
            margin-left: 15px;
            margin-right: 15px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .styled-table {
            width: 98%;
            border-collapse: collapse;
            border-spacing: 0;
            border-radius: 15px;
            overflow: hidden;
            margin-left: 15px;
            margin-right: 15px;
            margin-bottom: 15px;
            font-size: 0.9em;
            font-family: sans-serif;
            min-width: 400px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .styled-table thead {
            background-color: #313131;
            color: #ffffff;
            text-align: left;
            position: sticky; /* Keeps the header fixed when scrolling */
            top: 0;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.507); 
        }

        .styled-table th,
        .styled-table td {
            padding: 12px 15px;
        }

        .styled-table tbody {
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(93vh - 200px);
        }

        .styled-table thead,
        .styled-table tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .styled-table tbody tr {
            border-bottom: 1px solid #2e2e2e;
        }

        .styled-table tbody tr:nth-of-type(even) {
            background-color: #2e2e2e;
        }

        .updated-row {
            background-color: #e68a00 !important; /* Use !important to ensure the color is applied */
        }

        /* Styling the scrollbar for WebKit browsers (e.g., Chrome, Safari) */
        .styled-table tbody::-webkit-scrollbar, select::-webkit-scrollbar {
            background-color: #202020;
            width: 5px; /* Width of the scrollbar */
        }

        .styled-table tbody::-webkit-scrollbar-thumb, select::-webkit-scrollbar-thumb {
            background-color: #df9100; /* Color of the scrollbar thumb */
            border-radius: 6px; /* Roundness of the scrollbar thumb */
        }

        .styled-table tbody::-webkit-scrollbar-track, select::-webkit-scrollbar-track {
            background-color: #333; /* Color of the scrollbar track */
            border-radius: 6px; /* Roundness of the scrollbar track */
        }

        select::-webkit-scrollbar-thumb:hover {
            background-color: #e68a00; /* Darker shade on hover */
        }
        /* Main container to account for navbar width */
        .main-container {
            text-align: center;
            margin-left: 250px; /* Width of navbar (200px) + some space */
            padding: 20px;
            flex-grow: 1; /* Ensures the content takes up the remaining space */
        }
        .container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
            margin-right: 10px;
            gap: 10px; /* Space between input fields and buttons */
        }
    </style>
</head>
<body>
  <div id="navbar"></div>
    <div class="main-container">
        <h1>Welcome to the Real-Time Currency Tracker</h1>
        <h2>Track Currency Exchange Rates in Real-Time</h2>

        <!-- Additional Content -->
        <div class="content">
            <br><br>
            <p>This application provides you with real-time updates on currency exchange rates from around the world.</p>
            <!-- <p>Use the navigation above to explore different features and stay updated with the latest market trends.</p> -->
        </div>

        <!-- <footer>
            <p>&copy; 2024 Live Exchange Rates. All rights reserved.</p>
        </footer> -->
    </div>

    

</body>
</html>
<script>
          // Fetch the navbar.html content using Fetch API
          fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                // Insert the navbar HTML into the div with id="navbar"
                document.getElementById('navbar').innerHTML = data;
            })
            .catch(error => console.error('Error fetching navbar:', error));
</script>
