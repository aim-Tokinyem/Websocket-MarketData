<!-- navbar.html -->
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
    }

    nav {
        height: 100vh;
        width: 200px;
        background-color: #333;
        padding: 20px;
        position: fixed;
        top: 0;
        left: 0;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    nav ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }

    nav ul li {
        margin: 20px 0;
    }

    nav ul li a {
        text-decoration: none;
        color: #fff;
        padding: 10px 15px;
        display: block;
        border-radius: 4px;
        transition: background-color 0.3s, padding-left 0.3s;
    }

    nav ul li a:hover {
        background-color: #ff9800;
        padding-left: 25px;
    }


    /* Initially hide the navbar */
    .navbar-hidden {
        display: none;
    }

    .navbar-visible {
        display: block;
    }

        /* For WebKit browsers (Chrome, Safari) */
    ::-webkit-scrollbar {
        width: 10px; /* Width of the scrollbar */
    }

    ::-webkit-scrollbar-track {
        background-color: #333333; /* Dark background color for the scrollbar track */
    }

    ::-webkit-scrollbar-thumb {
        background-color: #e68a00; /* Orange color for the scrollbar thumb */
        border-radius: 6px; /* Rounded corners for the scrollbar thumb */
    }

    ::-webkit-scrollbar-thumb:hover {
        background-color: #cc7a00; /* Slightly darker orange on hover */
    }


</style>

<nav>
    <ul>
        <li><a href="home">Home</a></li>
        <li><a href="price_list">Price List</a></li>
        <li><a href="ticker_list">Ticker List</a></li>
    </ul>
</nav>
