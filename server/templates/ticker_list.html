<!DOCTYPE html>
<html>
<head>
    <title>Ticker List</title>
        <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3, h4 {
            text-align: center;
            margin-top: 30px;
        }
        /* Dark mode styles */
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="text"],
        select,
        button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
        }
        input[type="text"]:focus,
        select:focus {
            outline: none;
        }
        button {
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #555;
         }
        
        .styled-table-container {
            width: 98%;
            height: 550px; /* Set your desired height */
            overflow: auto;
            margin-left: 15px;
            margin-right: 15px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .styled-table {
            width: 98%;
            border-collapse: collapse;
            border-spacing: 0;
            border-radius: 15px;
            overflow: hidden;
            margin-left: 15px;
            margin-right: 15px;
            margin-bottom: 15px;
            font-size: 0.9em;
            font-family: sans-serif;
            min-width: 400px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .styled-table thead {
            background-color: #df9100;
            color: #ffffff;
            text-align: left;
            position: sticky; /* Keeps the header fixed when scrolling */
            top: 0;
            z-index: 1;
        }
        .styled-table thead {
            background-color: #313131;
            color: #ffffff;
            text-align: left;
            position: sticky; /* Keeps the header fixed when scrolling */
            top: 0;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.507); 
        }

        .styled-table th,
        .styled-table td {
            padding: 12px 15px;
        }

        .styled-table tbody {
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: calc(93vh - 200px);
        }


        .styled-table thead,
        .styled-table tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .styled-table tbody tr {
            border-bottom: 1px solid #2e2e2e;
        }

        /* .styled-table tbody th {
            border-bottom: 0 0 30px rgb(0, 0, 0); 
            box-shadow: 0 0 30px rgb(0, 0, 0); 
        } */

        .styled-table tbody tr:nth-of-type(even) {
            background-color: #2e2e2e;
        }
        .styled-table tbody tr.active-row {
            font-weight: bold;
            color: #df9100;
        }
        
        /* Styling the scrollbar for WebKit browsers (e.g., Chrome, Safari) */
        .styled-table tbody::-webkit-scrollbar, select::-webkit-scrollbar{
            background-color: #202020;
            width: 5px; /* Width of the scrollbar */
        }

        .styled-table tbody::-webkit-scrollbar-thumb, select::-webkit-scrollbar-thumb {
            background-color: #df9100; /* Color of the scrollbar thumb */
            border-radius: 6px; /* Roundness of the scrollbar thumb */
        }

        .styled-table tbody::-webkit-scrollbar-track, select::-webkit-scrollbar-track {
            background-color: #333; /* Color of the scrollbar track */
            border-radius: 6px; /* Roundness of the scrollbar track */
        }

        select::-webkit-scrollbar-thumb:hover {
            background-color: #e68a00; /* Darker shade on hover */
        }

        #add-modal,#edit-modal, #delete-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #202020;
            padding: 20px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 0 30px rgb(0, 0, 0);
            z-index: 1000; /* Ensure it’s above the overlay */
        }

        .modal-field {
            display: flex;
            align-items: center;
            margin-bottom: 10px; /* Space between fields */
        }

        .modal-field label {
            width: 120px; /* Adjust as needed */
            margin-right: 10px; /* Space between label and select element */
        }

        .modal-field select {
            flex: 1; /* Allows the select to take up the remaining space */
        }

        #add-button, #cancel-button3,
        #update-button, #delete-button,
        #cancel-button, #cancel-button2 {
            width: 100%; /* Set a consistent width for buttons */
            padding: 10px; /* Add padding for a better appearance */
            border: none;
            border-radius: 4px; /* Rounded corners for buttons */
            background-color: #333; /* Button color */
            color: #fff; /* Text color */
            font-size: 16px; /* Font size */
            cursor: pointer;
            margin: 5px; /* Space between buttons */
            transition: background-color 0.3s; /* Smooth color transition on hover */
            text-align: center;
        }

        #add-button:hover, #cancel-button3:hover,
        #update-button:hover, #delete-button:hover,
        #cancel-button:hover, #cancel-button2:hover {
            background-color: #e68a00; /* Darker shade on hover */
        }

        #button-container {
            text-align: center; /* Center the buttons */
            margin-top: 20px; /* Space above the button container */
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Dark semi-transparent background */
            display: none; /* Hide by default */
            z-index: 999; /* Ensure it’s below the modal */
        }
        .container {
            text-align: right;
            padding: 10px;
            margin-right: 10px;
        }
        .new-ticker-button {
            background-color: #e68a00;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: box-shadow 0.4s ease, background-color 0.4s ease;
            
        }

        .new-ticker-button:hover {
            background-color: #e68a00;
            box-shadow: 0 0 10px #e68a00;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: #fff;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: none; /* Initially hidden */
            z-index: 10000;
            opacity: 0.9; /* Slightly transparent */
        }

        .notification.success {
            background-color: #4CAF50; /* Green for success */
        }

        .notification.error {
            background-color: #f44336; /* Red for error */
        }

        .notification.warning {
            background-color: #ff9800; /* Orange for warning */
        }
        .main-container {
            margin-left: 250px;
            padding: 20px;
            flex-grow: 1; /* Ensures the content takes up the remaining space */
        }
        .container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
            gap: 10px;
        }
        .layout {
            display: flex;
            height: 100%;
            overflow: hidden; /* Prevents content from spilling out */
        }

    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="navbar"></div>
        <div class="main-container">
            <!-- <div id="footer"></div> -->
        
        <h1>Ticker List</h1>
        <div id="notification" class="notification"></div>
        
        <div class="container">
            <input type="text" id="filter-col-0" placeholder="Filter by Currency 1">
            <input type="text" id="filter-col-1" placeholder="Filter by Currency 2">

            <button class="new-ticker-button" onclick="addRow()">+ New Ticker</button>
        </div>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th id="currency1-header">Currency 1</th>
                        <th id="currency2-header">Currency 2</th>
                        <th id="ticker-header">Ticker</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <!-- <tr>
                    <td><select id="currency1"></select></td>
                    <td><select id="currency2"></select></td>
                    <td><input type="text" id="ticker" placeholder="Enter ticker here"></td>
                    <td><button onclick="submitData()">Submit</button></td>
                </tr> -->
                <tbody id="data-table">
                    <!-- Data will be dynamically updated here -->
                </tbody>
            </table>
        </div>
        </div>
</div>
    <!-- Edit Modal -->
    <div id="overlay"></div>


    <div id="add-modal">
        <h2>Add New Ticker Data</h2>
        <div class="modal-field">
            <label for="add-currency1">Currency 1:</label>
            <select id="currency1"></select>
        </div>
        <div class="modal-field">
            <label for="add-currency2">Currency 2:</label>
            <select id="currency2"></select>
        </div>
        <div class="modal-field">
            <label for="add-ticker">Ticker:</label>
            <input type="text" id="ticker" placeholder="Enter ticker here">
        </div>
    <br>
        <button onclick="submitData()" id="add-button">Save Ticker</button>
        <button id="cancel-button3">Cancel</button>
    </div>

    <div id="edit-modal">
        <h2>Edit Ticker Data</h2>
        <div class="modal-field">
            <label for="edited-currency1">Currency 1:</label>
            <select id="edited-currency1"></select>
        </div>
        <div class="modal-field">
            <label for="edited-currency2">Currency 2:</label>
            <select id="edited-currency2"></select>
        </div>
        <div class="modal-field">
            <label for="edited-ticker">Ticker:</label>
            <input type="text" id="edited-ticker" placeholder="Enter edited ticker">
        </div>
    <br>
        <button id="update-button">Update</button>
        <button id="cancel-button">Cancel</button>
    </div>

    <div id="delete-modal">
        <h4>Are you sure want to delete this ticker ?</h4>
        <button id="delete-button">Yes</button>
        <button id="cancel-button2">Cancel</button>
    </div>



    <script>
        // Fetch the navbar.html content using Fetch API
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                // Insert the navbar HTML into the div with id="navbar"
                document.getElementById('navbar').innerHTML = data;
            })
            .catch(error => console.error('Error fetching navbar:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Error fetching footer :', error));

        $(document).ready(function() {
            $.ajax({
                url: '/currency_data',
                type: 'GET',
                success: function(response) {
                    populateDropdown('currency1', response.data);
                    populateDropdown('currency2', response.data);
                },
                error: function(error) {
                    console.error('Error fetching currency values:', error);
                }
            });
        });

        function populateDropdown(elementId, data) {
            var dropdown = document.getElementById(elementId);
            data.forEach(function(item) {
                var option = document.createElement('option');
                option.value = item[1];
                option.textContent = item[1];
                dropdown.appendChild(option);
            });
        }

        function fetchData() {
            $.ajax({
                url: '/ticker_data',
                type: 'GET',
                success: function(response) {
                    console.log('Received data:', response.data);
                    updateUI(response.data);
                },
                error: function(error) {
                    console.error('Error fetching data:', error);
                }
            });
        }

        function updateUI(data) {
            $('#data-table').empty();

            // Get filter values
            const filterCol0 = $('#filter-col-0').val().toLowerCase();
            const filterCol1 = $('#filter-col-1').val().toLowerCase();

            // Filter data based on input values
            const filteredData = data.filter(function(item) {
                const col0 = item[0].toString().toLowerCase();
                const col1 = item[1].toString().toLowerCase();

                return col0.includes(filterCol0) && col1.includes(filterCol1);
            });

            // Append filtered data to the table
            filteredData.forEach(function(item) {
                $('#data-table').append(`
                    <tr>
                        <td>${item[0]}</td>
                        <td>${item[1]}</td>
                        <td>${item[2]}</td>
                        <td>
                            <button onclick="editRow('${item[0]}','${item[1]}','${item[2]}')">Edit</button>
                            <button onclick="deleteRow('${item[0]}','${item[1]}','${item[2]}')">Delete</button>
                        </td>
                    </tr>
                `);
            });
        }

        $(document).ready(function() {
            fetchData();

            // Add event listeners to filter inputs to update the UI when filter values change
            $('#filter-col-0').on('input', fetchData);
            $('#filter-col-1').on('input', fetchData);
        });
        

        function editRow(currency1, currency2, ticker) {
            console.log('Edit button clicked for ticker:', ticker);
            currentEditTicker = ticker; // Store the current ticker value
            fetchAndPopulateDropdown('edited-currency1', currency1);
            fetchAndPopulateDropdown('edited-currency2', currency2);
            $('#edited-ticker').val(ticker);
            $('#overlay').fadeIn(); // Show the overlay
            $('#edit-modal').fadeIn(); // Show the modal
            $('#update-button').off('click').on('click', function() {
                updateData(ticker);
                $('#edit-modal').fadeOut();
                $('#overlay').fadeOut();
            });
            $('#cancel-button').off('click').on('click', function() {
                $('#edit-modal').fadeOut(); // Hide the modal
                $('#overlay').fadeOut(); // Hide the overlay
            });
        }

        function closeModal() {
            $('#edit-modal').fadeOut(); // Hide the modal
            $('#overlay').fadeOut(); // Hide the overlay
        }

        function deleteRow(currency1,currency2,ticker) {
            console.log('Delete button clicked for ticker:', ticker);
            $('#delete-modal h4').text(`Are you sure want to delete this "${currency1}/${currency2}" ticker?`);
            $('#overlay').fadeIn(); // Show the overlay
            $('#delete-modal').fadeIn(); // Show the modal
            $('#delete-button').off('click').on('click', function() {
                deleteData(ticker);
                $('#delete-modal').fadeOut();
                $('#overlay').fadeOut();
            });
            $('#cancel-button2').off('click').on('click', function() {
                $('#delete-modal').fadeOut(); // Hide the modal
                $('#overlay').fadeOut(); // Hide the overlay
            });
        }

        $(document).ready(function() {
            fetchData();
        });

        function addRow(){
            $('#overlay').fadeIn(); // Show the overlay
            $('#add-modal').fadeIn(); // Show the modal
            $('#add-button').off('click').on('click', function() {
                submitData(ticker);
                $('#add-modal').fadeOut();
                $('#overlay').fadeOut();
            });
            $('#cancel-button3').off('click').on('click', function() {
                $('#add-modal').fadeOut(); // Hide the modal
                $('#overlay').fadeOut(); // Hide the overlay
            });
        }

        function submitData() {
            var currency1 = document.getElementById('currency1').value;
            var currency2 = document.getElementById('currency2').value;
            var ticker = document.getElementById('ticker').value;

            // Prepare data to send to the backend
            var data = {
                'currency1': currency1,
                'currency2': currency2,
                'ticker': ticker
            };

            // Send data to the backend using AJAX
            $.ajax({
                url: '/ticker_post', // Endpoint to submit data to Flask
                type: 'POST',
                contentType: 'application/json', // Set content type to JSON
                data: JSON.stringify(data), // Send data as JSON
                success: function(response) {
                    console.log('Data successfully added!', response.message);
                    showNotification('Data successfully added!', 'success');

                    fetchData(); // Refresh data after successful submission
                },
                error: function(error) {
                    console.error('Error adding data:', error.responseJSON.error);
                    showNotification('Error adding data.', 'error');
                }
            });
        }

        function fetchAndPopulateDropdown(elementId, selectedCurrency) {
            var dropdown = $('#' + elementId);
            dropdown.empty();
            
            $.ajax({
                url: '/currency_data',
                type: 'GET',
                success: function(response) {
                    response.data.forEach(function(item) {
                        var option = $('<option></option>').attr('value', item[1]).text(item[1]);
                        if (item[1] === selectedCurrency) {
                            option.attr('selected', true);
                        }
                        dropdown.append(option);
                    });
                },
                error: function(error) {
                    console.error('Error fetching currency values:', error);
                }
            });
        }

        function deleteData(ticker){
            var data = {
                'data': ticker
            };
            $.ajax({
                url: '/ticker_delete',
                type: 'POST',
                contentType: 'application/json', // Set content type to JSON
                data: JSON.stringify(data), // Send data as JSON
                success: function(response) {
                    console.log('Data successfully deleted!');
                    showNotification('Data successfully deleted!', 'success');

                    fetchData(); // Refresh data after deletion
                },
                error: function(error) {
                    showNotification('Error deleting data.', 'error');
                }
            });
        }
        

        function updateData(currentEditTicker) {
            let editedCurrency1 = $('#edited-currency1').val();
            let editedCurrency2 = $('#edited-currency2').val();
            let editedTicker = $('#edited-ticker').val();

            let data = {
                'currency1': editedCurrency1,
                'currency2': editedCurrency2,
                'ticker': editedTicker,
                'existing_ticker': currentEditTicker 
            };
            console.log('Data being sent to backend:', data);
            $.ajax({
                url: '/ticker_update',
                type: 'POST',
                contentType: 'application/json', 
                data: JSON.stringify(data), 
                success: function(response) {
                    console.log('Data updated successfully:', response.message);
                    $('#edit-modal').hide();
                    showNotification('Data successfully updated!', 'success');
                    fetchData(); 
                },
                error: function(error) {
                    console.error('Error updating data:', error.responseJSON.error);
                    showNotification('Error updating data.', 'error');
                }
            });
        }

        var sortingOrders = {};

        function sortTable(columnIndex) {
            var table, rows, switching, i, x, y, shouldSwitch;
            table = document.getElementById("data-table");
            switching = true;
            
            // Initialize sorting order for this column if not already defined
            if (!sortingOrders[columnIndex]) {
                sortingOrders[columnIndex] = 'asc'; 
            }

            while (switching) {
                switching = false;
                rows = table.rows;
                for (i = 0; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[columnIndex];
                    y = rows[i + 1].getElementsByTagName("TD")[columnIndex];

                    // Compare based on the sorting order
                    if (sortingOrders[columnIndex] === 'asc') {
                        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    } else {
                        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                }
            }

            // Toggle sorting order for the next click
            sortingOrders[columnIndex] = (sortingOrders[columnIndex] === 'asc') ? 'desc' : 'asc';
        }


        document.getElementById("currency1-header").addEventListener("click", function() {
            sortTable(0); // Index of Currency 1 column
        });

        document.getElementById("currency2-header").addEventListener("click", function() {
            sortTable(1); // Index of Currency 2 column
        });

        document.getElementById("ticker-header").addEventListener("click", function() {
            sortTable(2); // Index of Ticker column
        });
        
        function showNotification(message, type = 'success') {
            var notification = document.getElementById('notification');
            notification.textContent = message;
            
            // Add appropriate class based on the notification type
            notification.className = 'notification ' + type;
            
            // Show the notification
            $('#notification').fadeIn();

            // Hide the notification after 3 seconds
            setTimeout(function() {
                $('#notification').fadeOut();
                // notification.style.display = 'none';
            }, 3000);
        }

        </script>
</body>
</html>
